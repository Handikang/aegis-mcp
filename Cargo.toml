[package]
name = "aegis-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Aegis Contributors"]
description = "The Blazingly Fast Security Firewall & Transparent Proxy for Model Context Protocol"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
colored = "3.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.17"
